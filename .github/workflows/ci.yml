name: CI/CD

# CI: the same checks you can run locally; see Flowmerce/docs/operations/ci-cd.md.
# CD: after every check passes on main, the frontend is deployed to Vercel in DEMO mode
#     (synthetic data in the browser, no backend, no keys). Real data is never deployed.
# Actions are pinned to full commit hashes (the version is in the trailing comment); Dependabot proposes updates.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Flowmerce

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: Flowmerce/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev,seo]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy, strict)
        if: ${{ !cancelled() }}
        run: mypy
      - name: Tests (pytest)
        if: ${{ !cancelled() }}
        run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Flowmerce/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Flowmerce/frontend/package-lock.json
      - name: Install (exactly what package-lock.json specifies)
        run: npm ci
      - name: Build (Next.js)
        run: npm run build

  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Flowmerce/pyproject.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Flowmerce/frontend/package-lock.json
      - name: Build the frontend (exactly what package-lock.json specifies)
        working-directory: Flowmerce/frontend
        run: |
          npm ci
          npm run build
      - name: Install
        run: python -m pip install -e ".[seo]"
      - name: Boot the API and the frontend on a throwaway folder and probe them
        run: python scripts/ci_smoke.py --web

  deploy-demo:
    name: Deploy demo (Vercel)
    # Only the frontend is deployed, so the deploy waits on the frontend build and the full-app smoke test.
    # The Python lint/type/test jobs still run and must be green before merging (branch protection).
    needs: [frontend, smoke]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: demo
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT: flowmerce-demo
      VERCEL_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: Flowmerce/frontend
    steps:
      - name: Skip when the Vercel token is not set yet
        if: env.VERCEL_TOKEN == ''
        working-directory: .
        run: echo "::warning::VERCEL_TOKEN secret is not set; skipping the demo deploy. See Flowmerce/docs/operations/ci-cd.md."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.VERCEL_TOKEN != ''
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: 24
      - name: Check the token's shape (never prints it)
        if: env.VERCEL_TOKEN != ''
        run: |
          t="$VERCEL_TOKEN"
          echo "length=${#t}"
          case "$t" in *[[:space:]]*) echo "::warning::VERCEL_TOKEN contains spaces or line breaks; re-add it without them.";; esac
          case "$t" in *-*) echo "::warning::VERCEL_TOKEN contains '-'; Vercel tokens normally do not. Check you pasted the token itself.";; esac
      - name: Link the Vercel project (created on first run) and force DEMO mode
        if: env.VERCEL_TOKEN != ''
        run: |
          npx --yes vercel@latest link --yes --project "$VERCEL_PROJECT"
          npx --yes vercel@latest pull --yes --environment=production
      - name: Build in DEMO mode (synthetic data only, no backend)
        if: env.VERCEL_TOKEN != ''
        env:
          NEXT_PUBLIC_FLOWMERCE_DATA_SOURCE: demo
        run: npx --yes vercel@latest build --prod
      - name: Deploy
        id: deploy
        if: env.VERCEL_TOKEN != ''
        run: |
          npx --yes vercel@latest deploy --prebuilt --prod > deploy-url.txt
          # The shareable link is the project's production domain (https://<project>.vercel.app or similar);
          # the per-deployment URL may sit behind Vercel's own sign-in.
          npx --yes vercel@latest inspect "$(tail -n1 deploy-url.txt)" > inspect.txt 2>&1 || true
          prod=$(grep -oE 'https://[a-z0-9.-]+\.vercel\.app' inspect.txt | grep -v -- "-[a-z0-9]\{9\}-" | head -n1)
          [ -n "$prod" ] || prod=$(tail -n1 deploy-url.txt)
          echo "url=$prod" >> "$GITHUB_OUTPUT"
          echo "### Demo link: $prod" >> "$GITHUB_STEP_SUMMARY"

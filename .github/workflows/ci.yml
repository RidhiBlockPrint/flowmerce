name: CI/CD

# CI: the same checks you can run locally; see Flowmerce/docs/operations/ci-cd.md.
# CD: after the frontend build and smoke test pass on main, the frontend is published to GitHub Pages in DEMO mode
#     (synthetic data in the browser, no backend, no keys). Real data is never deployed.
# Actions are pinned to full commit hashes (the version is in the trailing comment); Dependabot proposes updates.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Flowmerce

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14"]   # the one supported version (ADR 0010)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: Flowmerce/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev,seo]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy, strict)
        if: ${{ !cancelled() }}
        run: mypy
      - name: Tests (pytest)
        if: ${{ !cancelled() }}
        run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Flowmerce/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Flowmerce/frontend/package-lock.json
      - name: Install (exactly what package-lock.json specifies)
        run: npm ci
      - name: Build (Next.js)
        run: npm run build

  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: Flowmerce/pyproject.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Flowmerce/frontend/package-lock.json
      - name: Build the frontend (exactly what package-lock.json specifies)
        working-directory: Flowmerce/frontend
        run: |
          npm ci
          npm run build
      - name: Install
        run: python -m pip install -e ".[seo]"
      - name: Boot the API and the frontend on a throwaway folder and probe them
        run: python scripts/ci_smoke.py --web

  container:
    name: Hosted container
    # Builds the image Render runs and checks the sign-in gate and the API inside it (no real keys, empty data).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t flowmerce-hosted .
      - name: Start it the way Render does
        run: |
          docker run -d --name fm -p 10000:10000 -e FLOWMERCE_LOGIN_PASSWORD=ci-only-password-0123456789 flowmerce-hosted
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:10000/healthz && break; sleep 2; done
      - name: Probe the gate and the API
        run: python3 scripts/hosted_probe.py http://127.0.0.1:10000 ci-only-password-0123456789
      - name: Refuses to start without a password
        run: |
          if docker run --rm flowmerce-hosted; then echo "::error::started without FLOWMERCE_LOGIN_PASSWORD"; exit 1; fi
      - name: Container log
        if: ${{ !cancelled() }}
        run: docker logs fm 2>&1 | tail -60

  pages-build:
    name: Build demo for GitHub Pages
    # Only the frontend is published, so this waits on the frontend build and the full-app smoke test.
    # The Python lint/type/test jobs still run and must be green before merging (branch protection).
    needs: [frontend, smoke]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Flowmerce/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Flowmerce/frontend/package-lock.json
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install (exactly what package-lock.json specifies)
        run: npm ci
      - name: Static export in DEMO mode (synthetic data only, no backend, no keys)
        env:
          FLOWMERCE_STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_FLOWMERCE_DATA_SOURCE: demo
        run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: Flowmerce/frontend/out

  pages-deploy:
    name: Deploy demo to GitHub Pages
    needs: pages-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
